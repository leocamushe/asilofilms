<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASÏLO</title>
<meta name="description" content="ASÏLO — productora audiovisual. Directores, fotógrafos, music videos y estudio en Chile, México y USA.">
<meta property="og:title" content="ASÏLO">
<meta property="og:image" content="img/p0.jpg">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23EE2B00'/%3E%3Cpolyline points='22,82 50,18 78,82' fill='none' stroke='%23F0E9D8' stroke-width='9'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
/* Layout: one-page site, hash-routed sections. Each page carries its own brand ground (black / cream / red), as in the PDF. Single fixed look, not theme-inverted. */
:root{
  --red:#EE2B00;
  --reel:#E1061B;
  --cream:#F0E9D8;
  --ink:#0A0A0A;
  --white:#FFFFFF;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --sans:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  --gutter:clamp(16px,2.4vw,32px);
  --pg-bg:var(--ink);--pg-fg:var(--white);--pg-accent:var(--red);--pg-rule:rgba(255,255,255,.35);
  --nav-fg:var(--white);--nav-hl-bg:var(--red);--nav-hl-fg:var(--ink);
  --ft-bg:var(--ink);--ft-fg:var(--red);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{margin:0;background:var(--pg-bg);color:var(--pg-fg);font-family:var(--mono);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background .35s,color .35s}
a{color:inherit}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--pg-accent);outline-offset:3px}

/* page palettes */
body[data-pal="black"]{--pg-bg:var(--ink);--pg-fg:var(--white);--pg-accent:var(--red);--pg-rule:rgba(255,255,255,.4);--nav-fg:var(--white);--ft-bg:var(--ink);--ft-fg:var(--red)}
body[data-pal="cream"]{--pg-bg:var(--cream);--pg-fg:var(--red);--pg-accent:var(--red);--pg-rule:var(--red);--nav-fg:var(--red);--nav-hl-bg:var(--red);--nav-hl-fg:var(--cream);--ft-bg:var(--cream);--ft-fg:var(--red)}
body[data-pal="red"]{--pg-bg:var(--red);--pg-fg:var(--cream);--pg-accent:var(--cream);--pg-rule:rgba(240,233,216,.7);--nav-fg:var(--cream);--nav-hl-bg:var(--cream);--nav-hl-fg:var(--red);--ft-bg:var(--white);--ft-fg:var(--red)}

/* ---------- header ---------- */
.top{position:fixed;left:0;right:0;top:0;z-index:40;padding:calc(14px + env(safe-area-inset-top,0px)) var(--gutter) 14px;text-align:center;color:var(--nav-fg);background:color-mix(in srgb,var(--pg-bg) 92%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:padding .3s ease,background .35s,box-shadow .3s}
.top .logo{transition:width .3s ease,margin .3s ease}
.top.compact{padding-bottom:8px;box-shadow:0 1px 0 color-mix(in srgb,var(--nav-fg) 25%,transparent)}
.top.compact .logo{width:clamp(96px,9vw,130px);margin-top:8px}
#app{display:block}
.nav{display:flex;justify-content:center;flex-wrap:wrap;gap:6px clamp(14px,2.6vw,40px);list-style:none;margin:0;padding:0}
.nav a{display:inline-block;text-decoration:none;font-weight:500;font-size:13px;letter-spacing:.04em;padding:2px 6px;color:var(--nav-fg)}
.nav a:hover{text-decoration:underline;text-underline-offset:4px}
.nav a[aria-current="page"]{background:var(--nav-hl-bg);color:var(--nav-hl-fg)}
body[data-route="home"] .nav a[aria-current="page"]{background:transparent;color:var(--nav-fg)}
.logo{display:inline-block;color:var(--nav-fg);margin:18px auto 0;width:clamp(150px,22vw,270px)}
.logo svg{width:100%;height:auto;display:block}
.menu-btn.burger{display:none}

/* compact bar after scroll */
.mini{display:none!important;position:fixed;left:0;right:0;top:0;z-index:40;display:flex;align-items:center;justify-content:center;gap:16px;padding:calc(10px + env(safe-area-inset-top,0px)) var(--gutter) 10px;background:color-mix(in srgb,var(--pg-bg) 88%,transparent);backdrop-filter:blur(6px);color:var(--nav-fg);transform:translateY(-110%);transition:transform .3s}
.mini.show{transform:none}
.mini .logo{margin:0;width:110px}
.menu-btn{background:none;border:0;padding:6px;cursor:pointer;color:inherit;display:grid;gap:5px}
.menu-btn span{display:block;width:26px;height:3px;background:currentColor}
.overlay{position:fixed;inset:0;z-index:50;background:var(--pg-bg);color:var(--nav-fg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:var(--gutter)}
.overlay ul{list-style:none;margin:0;padding:0;display:grid;gap:14px;text-align:center}
.overlay a{text-decoration:none;font-size:clamp(24px,6vw,40px);font-weight:600;letter-spacing:.04em}
.overlay a[aria-current="page"]{color:var(--pg-accent)}
body[data-pal="red"] .overlay a[aria-current="page"]{text-decoration:underline;text-underline-offset:6px}
.close-btn{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:var(--gutter);background:none;border:0;color:inherit;font:600 14px var(--mono);letter-spacing:.08em;cursor:pointer;padding:8px}

@media (max-width:720px){
  .top .nav{display:none}
  .top{display:flex;align-items:center;justify-content:space-between;padding-block:calc(12px + env(safe-area-inset-top,0px)) 12px}
  .top.compact{padding-bottom:10px}
  .top.compact .logo{width:100px;margin-top:0}
  .top .logo{margin:0;width:130px}
  .menu-btn.burger{display:grid}
  .mini{justify-content:space-between}
}

/* ---------- shared ---------- */
main{display:block}
.page-title{margin:clamp(28px,5vw,56px) 0 clamp(18px,3vw,32px);text-align:center;font-weight:600;font-size:clamp(24px,3.4vw,40px);letter-spacing:.06em;line-height:1.1;text-wrap:balance}
.wrap{padding-inline:var(--gutter)}
.frame{position:relative;overflow:hidden;background:#000}
.frame img{width:100%;height:100%;object-fit:cover;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
a.frame:hover img,.frame:hover img{transform:scale(1.025)}
.r169{aspect-ratio:16/9}
.reel-label{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;color:var(--reel);font-weight:600;font-size:clamp(28px,5.4vw,64px);letter-spacing:.12em;text-align:center;padding:0 16px;text-wrap:balance}
.diamond{position:absolute;right:clamp(12px,2vw,26px);bottom:clamp(12px,2vw,26px);width:clamp(20px,2.4vw,34px);color:var(--red)}
.diamond svg{width:100%;height:auto;display:block}

/* credit rows (home + music videos) */
.credit{display:grid;grid-template-columns:1fr minmax(0,auto) minmax(0,1fr);gap:4px 24px;align-items:baseline;border-top:1px solid var(--pg-rule);border-bottom:1px solid var(--pg-rule);margin:6px var(--gutter) 10px;padding:8px 4px;font-size:13px;letter-spacing:.06em}
.credit .title{font-weight:600;text-decoration:underline;text-underline-offset:3px}
.credit .role{font-weight:300;opacity:.85}
.credit .name{font-weight:600;text-decoration:none}
.credit .name:hover{text-decoration:underline;text-underline-offset:3px}
.credit .loc{grid-column:2/4;font-size:10px;font-weight:300;opacity:.75;letter-spacing:.08em}
.home .credit{grid-template-columns:1fr minmax(0,auto) minmax(0,1fr);padding:16px 4px 18px;margin-bottom:12px}
.home .credit .role{font-size:14px;letter-spacing:.04em}
.home .credit .name{font-size:14px}
.home .stack>.frame:not(.full),.home .h-item>.frame:not(.full){margin-inline:auto}
@media (max-width:600px){
  .credit,.home .credit{grid-template-columns:auto 1fr;gap:2px 14px}
  .credit .title{grid-column:1/-1}
  .credit .loc{grid-column:1/-1}
}

/* about */
.about{max-width:1100px;margin:0 auto;padding:clamp(20px,6vw,90px) var(--gutter) clamp(60px,9vw,140px);text-align:center;position:relative}
.about h1{margin:0 0 clamp(28px,4vw,48px);font-size:clamp(34px,4.4vw,56px);font-weight:600;letter-spacing:.04em}
.about p{margin:0 auto 1.6em;max-width:78ch;color:var(--ink);font-size:clamp(13px,1.15vw,16px);letter-spacing:.06em;line-height:1.55;text-transform:uppercase}
.about .invite{color:var(--ink);font-size:clamp(17px,1.7vw,22px);font-weight:500;letter-spacing:.08em;margin-top:.4em}
.about .diamond{position:static;margin:clamp(30px,5vw,70px) 0 0 auto;width:40px}

/* directors grid */
.dir-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(20px,3vw,40px) clamp(24px,8vw,104px);max-width:1040px;margin:0 auto;padding:0 var(--gutter) clamp(60px,8vw,110px)}
.dir-card{text-decoration:none;display:block}
.portrait{aspect-ratio:1;background:var(--cream);display:block;overflow:hidden}
.portrait svg{width:100%;height:100%;display:block;transition:transform .5s}
.dir-card:hover .portrait svg{transform:translateY(-3%)}
.dir-card h2{margin:10px 0 0;padding:8px 2px;border-top:1px solid var(--pg-rule);border-bottom:1px solid var(--pg-rule);font-size:clamp(16px,1.8vw,22px);font-weight:500;letter-spacing:.08em}
.dir-card p{margin:10px 2px 0;font-family:var(--sans);font-size:clamp(14px,1.3vw,17px);line-height:1.45;max-width:46ch}
@media (max-width:560px){.dir-grid{grid-template-columns:1fr}}

/* director detail */
.dd-gallery{display:grid;grid-template-columns:2fr 1fr;gap:clamp(10px,1.6vw,22px);padding:clamp(40px,7vw,86px) clamp(16px,1.7vw,22px) clamp(80px,12vw,170px)}
.dd-gallery .side{display:grid;gap:clamp(10px,1.6vw,22px);grid-template-rows:1fr 1fr}
.dd-gallery .frame{height:100%;min-height:0}
.dd-gallery .main{aspect-ratio:16/10}
.dd-hero{aspect-ratio:16/9;max-height:78vh;width:100%}
@media (max-width:640px){.dd-gallery{grid-template-columns:1fr}.dd-gallery .side{grid-template-rows:none;grid-template-columns:1fr 1fr}.dd-gallery .side .frame{aspect-ratio:16/10}}

/* photographers */
.ph-row{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,3.2fr);gap:clamp(16px,3vw,48px);padding:clamp(18px,2vw,26px) var(--gutter);border-top:1px solid var(--pg-rule)}
.ph-row:first-of-type{border-top:0}
.ph-prof .portrait{max-width:230px}
.ph-prof h2{margin:6px 0 0;padding:5px 2px;border-top:1px solid var(--pg-rule);border-bottom:1px solid var(--pg-rule);font-size:12px;font-weight:500;letter-spacing:.1em;max-width:230px}
.ph-prof p{margin:6px 2px 0;font-family:var(--sans);font-size:12px;line-height:1.45;max-width:230px;opacity:.9}
.ph-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-auto-rows:clamp(26px,3.4vw,52px);gap:clamp(10px,1.6vw,22px)}
.foto{background:var(--red);color:var(--cream);display:grid;place-items:center;font-weight:600;font-size:clamp(14px,1.6vw,22px);letter-spacing:.06em}
@media (max-width:640px){.ph-row{grid-template-columns:1fr}.ph-prof{display:grid;grid-template-columns:110px 1fr;gap:4px 14px;align-items:start}.ph-prof .portrait{grid-row:1/3}.ph-prof h2{margin-top:0}}

/* studio */
.studio{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:clamp(14px,2vw,26px);padding:clamp(20px,4vw,60px) var(--gutter) 0}
.studio .a{grid-column:1/8}.studio .b{grid-column:8/13;align-self:start}
.studio .c-wrap{grid-column:1/6;display:grid;gap:clamp(14px,2vw,22px);align-content:start}
.studio .d{grid-column:6/13}
.studio .frame{background:transparent}
.studio .frame img{height:auto}
.serv-bar{height:clamp(30px,3.4vw,48px);background:var(--red)}
.serv h2{margin:0;font-size:clamp(28px,3.4vw,44px);font-weight:600;letter-spacing:.03em;line-height:1}
.serv p{margin:8px 0 0;font-weight:300;text-transform:uppercase;letter-spacing:.04em;font-size:clamp(13px,1.15vw,16px);line-height:1.35;max-width:52ch}
.prod{text-align:center;padding:clamp(70px,10vw,150px) var(--gutter) clamp(60px,8vw,110px)}
.prod .k{font-weight:300;font-size:15px;letter-spacing:.02em}
.prod .n{margin:10px 0;font-weight:600;font-size:clamp(20px,2vw,26px);letter-spacing:.06em}
.prod a{font-size:15px;letter-spacing:.02em;text-decoration:none;border-bottom:1px solid currentColor}
@media (max-width:640px){.studio .a,.studio .b,.studio .c-wrap,.studio .d{grid-column:1/-1}}

/* contact */
.contact{max-width:1420px;margin:0 auto;padding:clamp(40px,10vw,150px) clamp(16px,14vw,296px) clamp(60px,9vw,140px)}
.contact h1{margin:0 0 12px;font-size:clamp(36px,4.4vw,58px);font-weight:600;letter-spacing:.02em;line-height:1}
.contact form{display:grid;gap:9px}
.contact input,.contact textarea{width:100%;border:0;background:var(--white);color:var(--red);font:400 clamp(14px,1.3vw,18px) var(--mono);letter-spacing:.06em;padding:10px 12px;border-radius:0;outline-offset:0}
.contact input::placeholder,.contact textarea::placeholder{color:var(--red);opacity:.85;text-transform:uppercase}
.contact textarea{min-height:96px;resize:vertical}
.form-foot{display:flex;justify-content:flex-end;align-items:center;gap:16px;flex-wrap:wrap}
.form-note{font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.contact button{background:var(--white);color:var(--red);border:0;font:600 12px var(--mono);letter-spacing:.08em;padding:10px 46px;cursor:pointer}
.contact button:hover{background:var(--red);color:var(--white)}
.offices{display:grid;gap:clamp(14px,2vw,24px);text-align:center;margin-top:clamp(40px,5vw,60px)}
.offices h2{margin:0 0 6px;font-size:clamp(26px,2.6vw,38px);font-weight:600;letter-spacing:.04em;line-height:1}
.offices p{margin:0;font-weight:300;font-size:clamp(16px,1.6vw,22px);letter-spacing:.06em;line-height:1.25}

/* ---------- footer ---------- */
.foot{background:var(--ft-bg);color:var(--ft-fg);display:grid;grid-template-columns:1.2fr 1fr .9fr;align-items:end;gap:28px;padding:clamp(28px,4vw,44px) var(--gutter)}
body[data-route="studio"] .foot,body[data-route="photographers"] .foot{border-top:1px solid var(--ft-fg);margin-inline:var(--gutter);padding-inline:0}
.foot .logo{color:var(--ft-fg);margin:0;width:clamp(120px,14vw,210px)}
.socials{display:flex;gap:clamp(14px,2vw,26px);margin-top:22px}
.socials span{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--soc-bg,var(--ink));color:var(--soc-fg,var(--white))}
body[data-pal="black"] .socials span{--soc-bg:var(--white);--soc-fg:var(--ink)}
.socials svg{width:16px;height:16px;fill:currentColor}
.foot ul{list-style:none;margin:0;padding:0;line-height:1.2}
.foot ul a{text-decoration:none;font-weight:600;font-size:14px;letter-spacing:.04em}
.foot ul a:hover{text-decoration:underline}
.foot .addr{display:grid;gap:6px;align-self:end}
.foot .addr b{display:block;font-size:14px;letter-spacing:.04em}
.foot .addr small{display:block;font-size:9.5px;font-weight:300;letter-spacing:.08em;line-height:1.25}
.redbar{height:clamp(36px,4vw,60px);background:var(--red)}
@media (max-width:640px){.foot{grid-template-columns:1fr 1fr}.foot .brand{grid-column:1/-1}}

.view{animation:fade .45s ease both}
@keyframes fade{from{opacity:.001;transform:translateY(8px)}to{opacity:1;transform:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* background reel */
.bgwrap{}
.bgv{position:absolute;left:50%;top:50%;width:101%;height:101%;transform:translate(-50%,-50%);border:0;opacity:0;transition:opacity 1s ease;pointer-events:none}
.bgv.on{opacity:1}
.sound{position:absolute;left:clamp(12px,2vw,24px);bottom:clamp(12px,2vw,24px);font:600 11px var(--mono);letter-spacing:.12em;color:var(--cream);background:rgba(10,10,10,.45);border:1px solid rgba(240,233,216,.7);padding:8px 12px;pointer-events:none;transition:background .2s}
.frame[data-video]:hover .sound{background:var(--red);border-color:var(--red)}
/* photographers mega menu (header) */
.top .mega{position:absolute;left:50%;top:calc(100% - 6px);transform:translate(-50%,-6px);width:min(980px,calc(100% - 2*var(--gutter)));display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;padding:18px;background:var(--pg-bg);box-shadow:0 18px 40px rgba(0,0,0,.25);border:1px solid color-mix(in srgb,var(--nav-fg) 25%,transparent);color:var(--nav-fg);text-align:left;opacity:0;visibility:hidden;transition:opacity .22s,transform .22s,visibility .22s;z-index:5}
.top .mega.open{opacity:1;visibility:visible;transform:translate(-50%,0)}
.top .mega a{color:inherit;text-decoration:none;display:grid;gap:8px}
.top .mega .thumbs{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:4px;aspect-ratio:16/10;overflow:hidden}
.top .mega .thumbs img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.top .mega .thumbs img:first-child{grid-row:1/3}
.top .mega a:hover img{transform:scale(1.04)}
.top .mega b{font-size:13px;font-weight:600;letter-spacing:.08em;border-top:1px solid currentColor;padding-top:6px}
.top .mega a:hover b,.top .mega a:focus-visible b{text-decoration:underline;text-underline-offset:4px}
.nav a.has-mega::after{content:" ▾";font-size:.8em}
@media (max-width:720px){.top .mega{display:none}}
/* photographer viewer + lightbox */
.viewer{min-width:0}
.v-big{display:block;width:100%;padding:0;border:0;background:#000;aspect-ratio:3/2;overflow:hidden;cursor:zoom-in}
.v-big img{width:100%;height:100%;object-fit:cover;transition:opacity .3s,transform .6s}
.v-big:hover img{transform:scale(1.02)}
.v-thumbs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-top:8px}
.v-thumbs button{padding:0;border:0;background:#000;aspect-ratio:3/2;cursor:pointer;opacity:.45;transition:opacity .2s;overflow:hidden}
.v-thumbs button:hover{opacity:.8}
.v-thumbs button[aria-current="true"]{opacity:1;outline:2px solid var(--red);outline-offset:2px}
.v-thumbs img{width:100%;height:100%;object-fit:cover}
@media (max-width:640px){.v-thumbs{grid-template-columns:repeat(3,minmax(0,1fr))}}
.lb{position:fixed;inset:0;z-index:120;background:rgba(5,5,5,.96);color:var(--white);display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:clamp(12px,3vw,40px)}
.lb figure{margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0}
.lb img{max-height:82vh;width:auto;max-width:100%;object-fit:contain}
.lb figcaption{margin-top:10px;font-size:11px;letter-spacing:.12em;opacity:.8}
.lb button{font:600 13px var(--mono);letter-spacing:.1em;color:var(--white);background:none;border:1px solid rgba(255,255,255,.5);padding:12px 14px;cursor:pointer}
.lb button:hover{background:var(--red);border-color:var(--red)}
.lb .x{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px}
/* footer logo waits until visible */
.logo.anim.wait *{animation-play-state:paused!important}
/* text wipe reveal on scroll */
.rv{clip-path:inset(-8px 100% -8px -8px);transform:translateX(-14px);transition:clip-path 1s cubic-bezier(.75,0,.2,1),transform 1s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s)}
.rv.in{clip-path:inset(-8px -8px -8px -8px);transform:none}
@media (prefers-reduced-motion:reduce){.rv{clip-path:none;transform:none;transition:none}}
/* home: videos que se apilan al hacer scroll */
.stackable .h-item{position:sticky;top:var(--hdr,90px);background:var(--pg-bg);padding-top:10px}
/* pausa entre videos: cada uno queda completo (con su crédito) un tramo antes de que el siguiente lo tape */
.stackable .h-item:not(:last-child){margin-bottom:45svh}
.stackable .h-item .credit{background:var(--pg-bg)}
.stackable .h-item .frame{aspect-ratio:auto;height:min(56.25vw,calc(100svh - var(--hdr,90px) - 120px));transform:scale(calc(.94 + var(--p,1) * .06));transform-origin:50% 0;will-change:transform}
.stackable .h-item .frame[style*="80%"]{height:min(45vw,calc(100svh - var(--hdr,90px) - 120px))}
.stackable .h-item .credit{margin-bottom:0}
.stackable .h-item:last-child{padding-bottom:28px}

function embedSrc(url){
  if(!url) return null;
  let m;
  if((m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/))([\w-]{11})/)))
    return {type:'iframe', src:`https://www.youtube-nocookie.com/embed/${m[1]}?autoplay=1&rel=0&playsinline=1&modestbranding=1`};
  if((m = url.match(/vimeo\.com\/(?:video\/)?(\d+)(?:\/(\w+))?/)))
    return {type:'iframe', src:`https://player.vimeo.com/video/${m[1]}?autoplay=1&byline=0&title=0&dnt=1${m[2]?'&h='+m[2]:''}`};
  if(/\.(mp4|webm|mov)(\?|$)/i.test(url)) return {type:'video', src:url};
  return null;
}
/* muted looping background version of a video (home reel) */
function bgEmbed(key){
  const url = VIDEOS[key] || ''; let m;
  if ((m = url.match(/vimeo\.com\/(?:video\/)?(\d+)(?:\/(\w+))?/)))
    return `<iframe class="bgv" data-kind="vimeo" src="https://player.vimeo.com/video/${m[1]}?background=1&autoplay=1&muted=1&loop=1&autopause=0&dnt=1${m[2]?'&h='+m[2]:''}" allow="autoplay; fullscreen; picture-in-picture" tabindex="-1" title="Reel" aria-hidden="true"></iframe>`;
  if ((m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/))([\w-]{11})/)))
    return `<iframe class="bgv" data-kind="yt" src="https://www.youtube-nocookie.com/embed/${m[1]}?autoplay=1&mute=1&loop=1&playlist=${m[1]}&controls=0&playsinline=1&modestbranding=1&rel=0" allow="autoplay" tabindex="-1" title="Reel" aria-hidden="true"></iframe>`;
  return '';
}
/* show the background video only once it is really playing; if blocked, the still stays */
function initBgVideos(){
  document.querySelectorAll('iframe.bgv:not([data-init])').forEach(f=>{
    f.dataset.init = '1';
    if (f.dataset.kind === 'vimeo' && window.Vimeo && Vimeo.Player){
      try { const pl = new Vimeo.Player(f); pl.on('timeupdate', function h(d){ if (d.seconds > 0.2){ f.classList.add('on'); pl.off('timeupdate', h); } }); } catch(e){}
    } else {
      f.addEventListener('load', ()=> setTimeout(()=>f.classList.add('on'), 1200));
    }
  });
}
/* attrs to make a frame playable */
const vattr = (key, label) => embedSrc(VIDEOS[key]) ? ` data-video="${key}" role="button" tabindex="0" aria-label="Reproducir ${label}"` : '';
const vplay = key => embedSrc(VIDEOS[key]) ? PLAY : '';
function playFrame(fr){
  const e = embedSrc(VIDEOS[fr.dataset.video]); if(!e) return;
  fr.classList.add('playing'); fr.removeAttribute('role'); fr.removeAttribute('tabindex');
  fr.innerHTML = e.type==='iframe'
    ? `<iframe src="${e.src}" allow="autoplay; fullscreen; picture-in-picture; encrypted-media" allowfullscreen title="Video"></iframe>`
    : `<video src="${e.src}" controls autoplay playsinline></video>`;
  const src = VIDEOS[fr.dataset.video];
  if (!(fr.nextElementSibling && fr.nextElementSibling.classList.contains('vlink')))
    fr.insertAdjacentHTML('afterend', `<a class="vlink" href="${src}" target="_blank" rel="noopener">¿No carga el video? Verlo en ${/vimeo/.test(src)?'Vimeo':'YouTube'} ↗</a>`);
  delete fr.dataset.video;
}
document.addEventListener('click', e=>{ const fr=e.target.closest('[data-video]'); if(fr){ e.preventDefault(); playFrame(fr);} });
document.addEventListener('keydown', e=>{ if((e.key==='Enter'||e.key===' ') && e.target.matches && e.target.matches('[data-video]')){ e.preventDefault(); playFrame(e.target);} });

        <a class="dl-nm" href="#photographers" aria-expanded="${pi===0}"><span>${p.name}</span><span class="dl-meta">${PH_PHOTOS[pi].length} FOTOS</span></a>
        <div class="dl-drop"><div>
        <div class="viewer" data-p="${pi}">
          <button type="button" class="v-big" data-open="0" aria-label="Ampliar foto 1 de ${p.name}"><img src="${PH_PHOTOS[pi][0]}" alt="Foto 1 de ${p.name}"></button>
          <div class="v-thumbs">${PH_PHOTOS[pi].map((u,i)=>`<button type="button" data-i="${i}" aria-current="${i===0}" aria-label="Ver foto ${i+1}"><img src="${u}" alt="" loading="lazy"></button>`).join('')}</div>

  studio(){

      <div class="st-after">
        <div class="serv-wrap">
          <div class="serv-bar"></div>
          <div class="serv"><h2>SERVICIOS</h2><p>Lorem ipsum dolor sit amet, consectetuer adipiscing elit, sed diam nonummy nibh euismod tincidunt ut laoreet dolore magna aliquam erat volutpat. Ut wisi enim ad minim veniam, quis nostrud exerci tation</p></div>
        </div>
      <div class="prod"><div class="k">PRODUCCIÓN</div><div class="n">RODRIGO QUINTANILLA</div><a href="#contact">CONTACTO</a></div>

  },

      <h1>CONTACTO</h1>
      <form id="cform" novalidate>
        <label class="sr" for="c-name">Nombre</label><input id="c-name" name="name" placeholder="Nombre" autocomplete="name" required>
        <label class="sr" for="c-mail">Email</label><input id="c-mail" name="email" type="email" placeholder="Email" autocomplete="email" required>
        <label class="sr" for="c-msg">Mensaje</label><textarea id="c-msg" name="message" placeholder="Mensaje" required></textarea>
        <div class="form-foot"><span class="form-note" id="c-note" role="status"></span><button type="submit">ENVIAR</button></div>
      </form>
      <div class="offices">${OFFICES.map(([c])=>`<div><h2>${c}</h2></div>`).join('')}</div>
    </section>`};
  }
};
function directorView(key){
  const D = DIRECTORS[key];
  return {pal:"red", html:`<section class="view"><h1 class="page-title" style="margin-top:clamp(40px,6vw,90px)">${D.name}</h1>
    <div class="frame dd-hero"${vattr(key,'reel de '+D.name)}>${img(D.hero,'Reel de '+D.name)}<div class="reel-label">${D.reel}</div>${vplay(key)}</div>
    <div class="dd-gallery">
      <div class="frame main">${img(D.gallery[0],'Still de '+D.name)}</div>
      <div class="side"><div class="frame">${img(D.gallery[1],'Still de '+D.name)}</div><div class="frame">${img(D.gallery[2],'Still de '+D.name)}</div></div>
    </div></section>`};
}

const SOC = {
  Facebook:'<path d="M13.5 21v-7.5h2.6l.4-3h-3V8.6c0-.9.3-1.5 1.5-1.5h1.6V4.4c-.3 0-1.2-.1-2.3-.1-2.3 0-3.9 1.4-3.9 4v2.2H7.8v3h2.6V21z"/>',
  X:'<path d="M17.5 3.5h2.9l-6.4 7.3 7.5 9.7h-5.9l-4.6-6-5.3 6H2.8l6.8-7.8L2.4 3.5h6l4.2 5.5zm-1 15.3h1.6L7.6 5.1H5.9z"/>',
  Instagram:'<path d="M12 7.3a4.7 4.7 0 1 0 0 9.4 4.7 4.7 0 0 0 0-9.4zm0 7.7a3 3 0 1 1 0-6 3 3 0 0 1 0 6zm4.9-8.9a1.1 1.1 0 1 0 0 2.2 1.1 1.1 0 0 0 0-2.2zM12 2.5c-2.6 0-2.9 0-3.9.1-3.5.2-5.4 2.1-5.6 5.6-.1 1-.1 1.3-.1 3.9s0 2.9.1 3.9c.2 3.5 2.1 5.4 5.6 5.6 1 .1 1.3.1 3.9.1s2.9 0 3.9-.1c3.5-.2 5.4-2.1 5.6-5.6.1-1 .1-1.3.1-3.9s0-2.9-.1-3.9c-.2-3.5-2.1-5.4-5.6-5.6-1-.1-1.3-.1-3.9-.1zm0 1.7c2.5 0 2.8 0 3.8.1 2.6.1 3.8 1.3 3.9 3.9.1 1 .1 1.3.1 3.8s0 2.8-.1 3.8c-.1 2.6-1.3 3.8-3.9 3.9-1 .1-1.3.1-3.8.1s-2.8 0-3.8-.1c-2.6-.1-3.8-1.3-3.9-3.9-.1-1-.1-1.3-.1-3.8s0-2.8.1-3.8c.1-2.6 1.3-3.8 3.9-3.9 1-.1 1.3-.1 3.8-.1z"/>',
  TikTok:'<path d="M16.6 3h-3.1v12.2a2.7 2.7 0 1 1-2.7-2.7c.3 0 .5 0 .8.1V9.4a5.8 5.8 0 1 0 5 5.8V9.1a7.3 7.3 0 0 0 4.1 1.3V7.3A4.2 4.2 0 0 1 16.6 3z"/>',
  YouTube:'<path d="M21.6 7.2a2.5 2.5 0 0 0-1.8-1.8C18.2 5 12 5 12 5s-6.2 0-7.8.4A2.5 2.5 0 0 0 2.4 7.2 26 26 0 0 0 2 12a26 26 0 0 0 .4 4.8 2.5 2.5 0 0 0 1.8 1.8C5.8 19 12 19 12 19s6.2 0 7.8-.4a2.5 2.5 0 0 0 1.8-1.8A26 26 0 0 0 22 12a26 26 0 0 0-.4-4.8zM10 15V9l5.2 3z"/>'
};
function footerHTML(){
  return `<div class="foot">
    <div class="brand"><a class="logo" href="#home" aria-label="ASÏLO — inicio">${LOGO}</a>
      <div class="socials">${Object.entries(SOC).map(([n,p])=> SOCIAL[n]
        ? `<a href="${SOCIAL[n]}" target="_blank" rel="noopener" aria-label="${n}"><svg viewBox="0 0 24 24">${p}</svg></a>`
        : `<span role="img" aria-label="${n}"><svg viewBox="0 0 24 24">${p}</svg></span>`).join('')}</div></div>
    <ul>${NAV.slice(1).map(([k,l])=>`<li><a href="#${k}">${l}</a></li>`).join('')}</ul>
    <div class="addr">${OFFICES.map(([c])=>`<div><b>${c}</b></div>`).join('')}</div>
  </div>`;
}

/* ---------- router ---------- */
const app = document.getElementById('app');
const footer = document.getElementById('footer');
document.querySelectorAll('[data-logo]').forEach(el=>el.innerHTML=LOGO);
const navHTML = active => NAV.map(([k,l])=>`<li><a href="#${k}" ${k===active?'aria-current="page"':''}>${l}</a></li>`).join('');
/* mega menu de fotógrafos */
const megaEl = document.getElementById('mega');
megaEl.innerHTML = PHOTOGRAPHERS.map((p,i)=>`<a href="#photographers" data-ph="${i}"><span class="thumbs">${PH_PHOTOS[i].slice(0,3).map(u=>`<img src="${u}" alt="" loading="lazy">`).join('')}</span><b>${p.name}</b></a>`).join('');
let megaT;
const megaOpen = v => { clearTimeout(megaT); megaEl.classList.toggle('open', v); const t = document.querySelector('#nav .has-mega'); if (t) t.setAttribute('aria-expanded', String(v)); };
const megaLater = () => { clearTimeout(megaT); megaT = setTimeout(()=>megaOpen(false), 220); };
const navEl = document.getElementById('nav');
navEl.addEventListener('mouseover', e=>{ if (e.target.closest('.has-mega')) megaOpen(true); else if (e.target.closest('a')) megaOpen(false); });
navEl.addEventListener('mouseleave', megaLater);
megaEl.addEventListener('mouseenter', ()=>clearTimeout(megaT));
megaEl.addEventListener('mouseleave', megaLater);
navEl.addEventListener('click', e=>{
  const t = e.target.closest('.has-mega'); if (!t) return;
  if (matchMedia('(hover: none)').matches && !megaEl.classList.contains('open')) { e.preventDefault(); megaOpen(true); }
});
megaEl.addEventListener('click', e=>{
  const a = e.target.closest('a[data-ph]'); if (!a) return;
  window.__phTarget = +a.dataset.ph; megaOpen(false);
  if (location.hash === '#photographers') { e.preventDefault(); scrollToPh(); }
});
document.addEventListener('keydown', e=>{ if (e.key==='Escape') megaOpen(false); });
document.addEventListener('click', e=>{ if (!e.target.closest('#mega') && !e.target.closest('.has-mega')) megaOpen(false); });
function scrollToPh(){
  if (window.__phTarget == null) return;
  const row = document.getElementById('ph-' + window.__phTarget); window.__phTarget = null;
  if (row) setTimeout(()=>window.scrollTo({top: row.getBoundingClientRect().top + window.scrollY - topEl.offsetHeight - 10, behavior:'smooth'}), 60);
}

function render(){
  let key = (location.hash||'#home').slice(1) || 'home';
  let v, navKey = key;
  if (DIRECTORS[key]) { v = directorView(key); navKey = 'directors'; }
  else if (views[key]) v = views[key]();
  else { key='home'; navKey='home'; v = views.home(); }
  document.body.dataset.pal = v.pal;
  document.body.dataset.route = key;
  document.getElementById('nav').innerHTML = navHTML(navKey);
  document.getElementById('overlay-nav').innerHTML = navHTML(navKey);
  app.innerHTML = v.html;
  footer.innerHTML = v.noFooter ? '' : footerHTML();
  closeMenu();
  window.scrollTo({top:0,behavior:'instant'});
  initBgVideos();
  if (typeof stackTick === 'function') setTimeout(stackTick, 30);
  setupReveal();
  if (key === 'photographers') scrollToPh();
  if (!window.__logoDone) { window.__logoDone = true; document.querySelector('.top .logo').classList.add('anim'); }
  const f = document.getElementById('cform');
  if (f) f.addEventListener('submit', e=>{
    e.preventDefault();
    const note = document.getElementById('c-note');
    if (!f.checkValidity()) { note.textContent = 'Completa nombre, un email válido y el mensaje.'; f.querySelector(':invalid').focus(); return; }
    if (!FORM_ENDPOINT) { note.textContent = 'El envío aún no está conectado.'; return; }
    const btn = f.querySelector('button'); btn.disabled = true; note.textContent = 'Enviando…';
    fetch(FORM_ENDPOINT, {method:'POST', headers:{'Accept':'application/json'}, body:new FormData(f)})
      .then(r=>{ if(!r.ok) throw 0; f.reset(); note.textContent = 'Mensaje enviado. Gracias.'; })
      .catch(()=>{ note.textContent = 'No se pudo enviar. Intenta de nuevo en un momento.'; })
      .finally(()=>{ btn.disabled = false; });
  });
}
window.addEventListener('hashchange', render);

/* menu + compact bar */
const overlay = document.getElementById('overlay'), mini = document.getElementById('mini');
function openMenu(){ overlay.hidden = false; document.getElementById('close').focus(); }
function closeMenu(){ overlay.hidden = true; }
document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click', openMenu));
document.getElementById('close').addEventListener('click', closeMenu);
overlay.addEventListener('click', e=>{ if (e.target.closest('a')) closeMenu(); });
document.addEventListener('keydown', e=>{ if (e.key==='Escape') closeMenu(); });
const topEl = document.getElementById('top');
/* fixed header: reserve its full height, shrink it after scrolling */
const appEl = document.getElementById('app');
function sizeHeader(){
  const c = topEl.classList.contains('compact');
  if (c) topEl.classList.remove('compact');
  appEl.style.paddingTop = topEl.offsetHeight + 'px';
  if (c) topEl.classList.add('compact');
}
function onScroll(){
  topEl.classList.toggle('compact', window.scrollY > 40);
  document.documentElement.style.setProperty('--hdr', topEl.offsetHeight + 'px');
  stackTick();
}
/* home: cada video sube y tapa al anterior; escala leve al entrar */
let stTick = false;
function stackUpdate(){
  stTick = false;
  const vh = window.innerHeight;
  document.querySelectorAll('.stackable .h-item').forEach(it=>{
    const r = it.getBoundingClientRect();
    const raw = Math.max(0, Math.min(1, (vh - r.top) / (vh * 0.65)));
    it.querySelector('.frame').style.setProperty('--p', (1 - Math.pow(1 - raw, 3)).toFixed(4));
  });
}
function stackTick(){ if (!stTick){ stTick = true; requestAnimationFrame(stackUpdate); } }
topEl.addEventListener('transitionend', ()=>document.documentElement.style.setProperty('--hdr', topEl.offsetHeight + 'px'));
window.addEventListener('scroll', onScroll, {passive:true});
window.addEventListener('resize', sizeHeader);
/* directores: abrir fila al pasar el mouse; en pantallas táctiles el primer toque abre y el segundo entra */
function dlOpen(row, keep){
  if (!row || row.classList.contains('open')) return;
  const y0 = keep ? keep.getBoundingClientRect().top : null;
  document.querySelectorAll('.dl-row').forEach(r=>{ const on = r===row; r.classList.toggle('open', on); r.querySelector('.dl-nm').setAttribute('aria-expanded', String(on)); });
  if (keep){ /* mantiene el nombre bajo el cursor mientras la fila de arriba se cierra */
    const t0 = performance.now();
    (function hold(){ const dy = keep.getBoundingClientRect().top - y0; if (Math.abs(dy) > .5) window.scrollBy(0, dy); if (performance.now() - t0 < 900) requestAnimationFrame(hold); })();
  }
}
let dlTouch = null;
/* solo abre con movimiento real del mouse (no con los eventos que genera el propio cambio de altura) */
let dlLast = {x:-1, y:-1};
document.addEventListener('pointermove', e=>{
  if (e.pointerType !== 'mouse') return;
  if (Math.abs(e.clientX - dlLast.x) < 2 && Math.abs(e.clientY - dlLast.y) < 2) return;
  const n = e.target.closest && e.target.closest('.dl-nm'); if (!n) return;
  const row = n.closest('.dl-row'); if (row.classList.contains('open')) return;
  dlLast = {x:e.clientX, y:e.clientY}; dlOpen(row, n);
});
document.addEventListener('pointerdown', e=>{ const n = e.target.closest('.dl-nm'); dlTouch = (n && e.pointerType !== 'mouse' && !n.closest('.dl-row').classList.contains('open')) ? n : null; });
document.addEventListener('focusin', e=>{ const n = e.target.closest('.dl-nm'); if (n && n.matches(':focus-visible')) dlOpen(n.closest('.dl-row')); });
document.addEventListener('click', e=>{
  const n = e.target.closest('.dl-nm'); if (!n) return;
  const row = n.closest('.dl-row');
  if (dlTouch === n || !row.classList.contains('open')) { e.preventDefault(); dlTouch = null; dlOpen(row, n); }
});
/* barrido de textos al aparecer con el scroll */
const RV_SEL = ['main .serv-bar','main .dl-nm','main h1:not(.sr)','main h2','main p','main .credit','main .reel-label','main .prod > *','main .offices > div','main .serv h2','main .form-foot','main label + input','main textarea','footer ul li','footer .addr > div','footer .socials'].join(',');
/* (IntersectionObserver ignora elementos recortados con clip-path, por eso se mide con el scroll) */
const rvOn = !matchMedia('(prefers-reduced-motion: reduce)').matches;
let rvPending = [], rvTick = false;
function rvCheck(){
  rvTick = false;
  const vh = window.innerHeight; let k = 0;
  rvPending = rvPending.filter(el=>{
    if (!el.isConnected) return false;
    const r = el.getBoundingClientRect();
    if (r.top < vh * 0.94 && r.bottom > 0){ el.style.setProperty('--d', Math.min(k++ * 0.08, 0.6) + 's'); el.classList.add('in'); return false; }
    return true;
  });
}
const rvSchedule = () => { if (!rvTick){ rvTick = true; requestAnimationFrame(rvCheck); } };
window.addEventListener('scroll', rvSchedule, {passive:true});
window.addEventListener('resize', rvSchedule);
const logoIO = ('IntersectionObserver' in window && !matchMedia('(prefers-reduced-motion: reduce)').matches)
  ? new IntersectionObserver(entries=>entries.forEach(e=>{ if (e.isIntersecting){ e.target.classList.remove('wait'); logoIO.unobserve(e.target); } }), {threshold:0.6})
  : null;
function setupReveal(){
  const fl = document.querySelector('footer .logo');
  if (fl && logoIO && !fl.dataset.rv){ fl.dataset.rv = '1'; fl.classList.add('anim','wait'); logoIO.observe(fl); }
  if (!rvOn) return;
  document.querySelectorAll(RV_SEL).forEach(el=>{ if (el.dataset.rv) return; el.dataset.rv = '1'; el.classList.add('rv'); rvPending.push(el); });
  setTimeout(rvSchedule, 60);
}
/* visor de fotógrafos + lightbox */
const lb = document.getElementById('lb'), lbImg = document.getElementById('lbImg'), lbCap = document.getElementById('lbCap');
let lbP = 0, lbI = 0, lbFocus = null;
function lbShow(i){ const list = PH_PHOTOS[lbP]; lbI = (i + list.length) % list.length; lbImg.src = list[lbI]; lbImg.alt = `Foto ${lbI+1} de ${PHOTOGRAPHERS[lbP].name}`; lbCap.textContent = `${PHOTOGRAPHERS[lbP].name} · ${lbI+1} / ${list.length}`; }
function lbOpen(p, i){ lbFocus = document.activeElement; lbP = p; lbShow(i); lb.hidden = false; document.body.style.overflow = 'hidden'; document.getElementById('lbClose').focus(); }
function lbClose(){ lb.hidden = true; document.body.style.overflow = ''; if (lbFocus) lbFocus.focus(); }
document.getElementById('lbPrev').onclick = ()=>lbShow(lbI-1);
document.getElementById('lbNext').onclick = ()=>lbShow(lbI+1);
document.getElementById('lbClose').onclick = lbClose;
lb.addEventListener('click', e=>{ if (e.target === lb) lbClose(); });
document.addEventListener('keydown', e=>{ if (lb.hidden) return; if (e.key==='Escape') lbClose(); if (e.key==='ArrowRight') lbShow(lbI+1); if (e.key==='ArrowLeft') lbShow(lbI-1); });
let lbX = null;
lb.addEventListener('touchstart', e=>{ lbX = e.touches[0].clientX; }, {passive:true});
lb.addEventListener('touchend', e=>{ if (lbX == null) return; const dx = e.changedTouches[0].clientX - lbX; if (Math.abs(dx) > 40) lbShow(lbI + (dx < 0 ? 1 : -1)); lbX = null; });
document.addEventListener('click', e=>{
  const v = e.target.closest('.viewer'); if (!v) return;
  const p = +v.dataset.p;
  const t = e.target.closest('.v-thumbs button');
  if (t){
    const i = +t.dataset.i, big = v.querySelector('.v-big'), im = big.querySelector('img');
    v.querySelectorAll('.v-thumbs button').forEach(b=>b.setAttribute('aria-current', String(b===t)));
    im.style.opacity = 0;
    setTimeout(()=>{ im.src = PH_PHOTOS[p][i]; im.alt = `Foto ${i+1} de ${PHOTOGRAPHERS[p].name}`; big.dataset.open = i; big.setAttribute('aria-label', `Ampliar foto ${i+1} de ${PHOTOGRAPHERS[p].name}`); im.style.opacity = 1; }, 160);
    return;
  }
  const b = e.target.closest('.v-big'); if (b) lbOpen(p, +b.dataset.open);
});
render(); sizeHeader(); onScroll();
</script>
</body>
</html>
